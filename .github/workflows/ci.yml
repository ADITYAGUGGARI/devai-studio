name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/constraints.txt
      - run: python -m pip install -c api/constraints.txt -e './api[dev]'
      - run: ruff check api
      - run: ruff format --check api
      - run: python -m pytest -c api/pyproject.toml api/tests
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm --prefix mobile ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
